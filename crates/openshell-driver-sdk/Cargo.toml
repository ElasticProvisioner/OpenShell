[package]
name = "openshell-driver-sdk"
description = "Shared building blocks for gateway-launched compute drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
http = { workspace = true }
libc = "0.2"
openshell-core = { path = "../openshell-core", default-features = false, features = ["otel"] }
openshell-crypto = { workspace = true }
openshell-driver-launch = { path = "../openshell-driver-launch" }
openshell-otel = { path = "../openshell-otel" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
