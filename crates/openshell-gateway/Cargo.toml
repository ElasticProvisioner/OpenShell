[package]
name = "openshell-gateway"
description = "OpenShell gateway binary composition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openshell-gateway"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
openshell-core = { path = "../openshell-core", default-features = false }
openshell-server = { path = "../openshell-server", default-features = false }
openshell-otel = { path = "../openshell-otel", optional = true }
async-trait = "0.1"
miette = { workspace = true }
tokio = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
openshell-driver-kubernetes = { path = "../openshell-driver-kubernetes", optional = true }
openshell-driver-launch = { path = "../openshell-driver-launch", optional = true }
openshell-driver-sdk = { path = "../openshell-driver-sdk", optional = true }
hyper-util = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
rustix = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
openshell-driver-mxc = { path = "../openshell-driver-mxc", optional = true }

[features]
default = ["telemetry", "in-tree-compute-drivers"]
# Opt-in bundle for experimental features; stable builds leave it off.
experimental = ["openshell-server/experimental"]
in-tree-compute-drivers = [
    "compute-driver-docker",
    "compute-driver-kubernetes",
    "compute-driver-podman",
    "compute-driver-vm",
    "compute-driver-mxc",
]
compute-driver-mxc = ["dep:openshell-driver-mxc"]
compute-driver-docker = ["driver-launcher"]
compute-driver-kubernetes = ["dep:openshell-driver-kubernetes", "dep:openshell-otel"]
compute-driver-podman = ["driver-launcher"]
compute-driver-vm = ["driver-launcher"]
## Launch a compute driver as a subprocess with `serve` and `Configure`.
driver-launcher = [
    "dep:openshell-driver-launch",
    "dep:openshell-driver-sdk",
    "dep:openshell-otel",
    "dep:hyper-util",
    "dep:rustix",
    "dep:tonic",
    "dep:tower",
    "dep:tracing",
    "dep:toml",
    "dep:tempfile",
]
telemetry = ["openshell-core/telemetry", "openshell-server/telemetry"]
## Convenience alias: every default feature except `telemetry`. Build a
## telemetry-free gateway with
## `--no-default-features --features defaults-without-telemetry` and stay
## correct as new default features are added. Cargo cannot subtract a single
## default feature, so this alias must be paired with `--no-default-features`;
## enabling it alongside `telemetry` is a compile error rather than a silent
## telemetry-on build. Kept in sync with `default` by
## `rust:verify:defaults-without-telemetry`.
defaults-without-telemetry = ["in-tree-compute-drivers"]
vendored-z3 = ["openshell-server/vendored-z3"]

[lints]
workspace = true

[dev-dependencies]
openshell-crypto = { workspace = true, default-features = false, features = ["aws-lc"] }
nix = { workspace = true }
rcgen = { workspace = true }
tempfile = "3"
openshell-otel-test-support = { path = "../openshell-otel-test-support" }
toml = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
