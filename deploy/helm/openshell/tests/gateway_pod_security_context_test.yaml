suite: gateway pod securityContext
templates:
  - templates/gateway-config.yaml
  - templates/statefulset.yaml
  - templates/deployment.yaml
release:
  name: openshell
  namespace: my-namespace

tests:
  - it: renders the pod securityContext from podSecurityContext by default
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000

  - it: renders an explicitly set podSecurityContext
    template: templates/statefulset.yaml
    set:
      podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: renders a Restricted-compatible container securityContext by default
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-tmp
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openshell-data
            mountPath: /var/openshell
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-state
            mountPath: /var/lib/openshell-state
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-state
            emptyDir: {}

  - it: keeps a Deployment root read-only with writable temporary and state volumes
    template: templates/deployment.yaml
    set:
      workload.kind: deployment
      server.externalDbSecret: my-pg-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-tmp
            emptyDir: {}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gateway-state
            mountPath: /var/lib/openshell-state
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-state
            emptyDir: {}

  - it: allows an operator to opt out of a read-only root filesystem
    template: templates/statefulset.yaml
    set:
      securityContext.readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: preserves an operator-supplied temporary volume without duplicate mounts
    template: templates/statefulset.yaml
    set:
      server.extraVolumes:
        - name: custom-tmp
          emptyDir:
            medium: Memory
      server.extraVolumeMounts:
        - name: custom-tmp
          mountPath: /tmp
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.mountPath == "/tmp")].name
          value: custom-tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: custom-tmp
            emptyDir:
              medium: Memory
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gateway-tmp
            emptyDir: {}

  - it: preserves Deployment temporary volume overrides
    template: templates/deployment.yaml
    set:
      workload.kind: deployment
      server.externalDbSecret: my-pg-secret
      securityContext.readOnlyRootFilesystem: false
      server.extraVolumes:
        - name: custom-tmp
          emptyDir: {}
      server.extraVolumeMounts:
        - name: custom-tmp
          mountPath: /tmp
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.mountPath == "/tmp")].name
          value: custom-tmp
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gateway-tmp
            emptyDir: {}

  - it: retains writable temporary storage with OpenShift-assigned identities
    template: templates/statefulset.yaml
    set:
      securityContext.runAsUser: null
      podSecurityContext.fsGroup: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.securityContext.fsGroup
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-tmp
            emptyDir: {}

  - it: omits the pod securityContext block when podSecurityContext is null
    template: templates/statefulset.yaml
    set:
      podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext

  - it: derives host aliases from server.hostGatewayIP and not gatewayConfig
    template: templates/statefulset.yaml
    set:
      server.hostGatewayIP: 10.23.45.67
      gatewayConfig:
        openshell.drivers.kubernetes:
          host_gateway_ip: 192.0.2.1
    asserts:
      - equal:
          path: spec.template.spec.hostAliases[0].ip
          value: 10.23.45.67
      - contains:
          path: spec.template.spec.hostAliases[0].hostnames
          content: host.openshell.internal
